<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Manhattan Heli</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1018; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #9fe6ff; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; font-size: 13px; letter-spacing: .08em; line-height: 1.7; text-transform: uppercase; }
  #stats { left: 20px; top: 16px; }
  #mission { right: 20px; top: 16px; text-align: right; }
  #help { white-space: pre; left: 20px; bottom: 16px; opacity: .55; font-size: 11px; }
  #arrow { position: absolute; left: 50%; top: 86px; width: 44px; height: 44px; margin-left: -22px; }
  #arrow svg { width: 100%; height: 100%; }
  #big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 15px; letter-spacing: .15em; white-space: pre-line; }
  #big b { font-size: 44px; font-weight: 300; letter-spacing: .3em; display: block; margin-bottom: 14px; color: #fff; }
  .label { position: absolute; left: 0; top: 0; font-size: 11px; letter-spacing: .1em; color: #8fb8c8; white-space: nowrap; text-shadow: 0 0 6px #0a1018, 0 0 2px #0a1018; transition: opacity .3s; opacity: 0; }
  .label.focus { font-size: 13px; color: #eaf9ff; padding-bottom: 6px; border-bottom: 1px solid rgba(255,179,107,.8); }
  .label small { margin-left: 8px; color: #ffb36b; font-size: 11px; }
  #credit { text-transform: none; position: absolute; right: 20px; bottom: 16px; font-size: 11px; letter-spacing: .06em; opacity: .55; pointer-events: auto; }
  #credit a { color: inherit; text-decoration: none; }
  #credit a:hover { text-decoration: underline; }
  .warn { color: #ff9a5a; }
</style>
</head>
<body>
<div id="hud">
  <div id="stats" class="panel"></div>
  <div id="mission" class="panel"></div>
  <div id="arrow"><svg viewBox="-22 -22 44 44"><g id="arrowRot"><path d="M0 -16 L10 12 L0 6 L-10 12 Z" fill="none" stroke="#ffb36b" stroke-width="1.6" stroke-linejoin="round"/></g></svg></div>
  <div id="big"></div>
  <div id="help" class="panel"></div>
  <div id="credit" class="panel"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
